<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>专注丛林 - Focus Jungle</title>
<meta name="theme-color" content="#154212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="专注丛林">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ========== Root & Variables ========== */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --surface:#fbf9f5;
  --surface-dim:#dbdad6;
  --surface-container-low:#f5f3ef;
  --surface-container:#efeeea;
  --surface-container-high:#eae8e4;
  --surface-container-highest:#e4e2de;
  --on-surface:#1b1c1a;
  --on-surface-variant:#42493e;
  --outline:#72796e;
  --outline-variant:#c2c9bb;
  --primary:#154212;
  --primary-container:#2d5a27;
  --on-primary:#ffffff;
  --inverse-primary:#a1d494;
  --secondary:#725a39;
  --secondary-container:#fbdbb0;
  --on-secondary-container:#584324;
  --tertiary:#5b2a36;
  --tertiary-container:#ffd9df;
  --error:#ba1a1a;
  --error-container:#ffdad6;
  --gold:#c89f18;
  --green-light:#a1d494;
  --green-mid:#4a9e4f;
  --green-dark:#2d8a3e;
  --brown:#8B7355;
  --brown-dark:#6b5435;
  --radius-sm:0.5rem;
  --radius:1rem;
  --radius-md:1.5rem;
  --radius-lg:2rem;
  --radius-xl:3rem;
  --radius-full:9999px;
  --shadow-1:0 1px 3px rgba(139,115,85,0.1),0 1px 2px rgba(139,115,85,0.06);
  --shadow-2:0 4px 12px rgba(139,115,85,0.1),0 2px 4px rgba(139,115,85,0.06);
  --shadow-3:0 8px 24px rgba(139,115,85,0.12),0 4px 8px rgba(139,115,85,0.06);
  --shadow-btn:0 3px 8px rgba(21,66,18,0.2),0 1px 3px rgba(21,66,18,0.12);
  --shadow-btn-active:0 1px 3px rgba(21,66,18,0.15);
  --font-serif:'Noto Serif SC','Noto Serif','Songti SC','STSong','SimSun',serif;
  --font-sans:'Plus Jakarta Sans','PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;
}

html,body{
  height:100%;overflow:hidden;
  font-family:var(--font-sans);
  background:var(--surface);
  color:var(--on-surface);
  -webkit-font-smoothing:antialiased;
}

body{
  display:flex;flex-direction:column;
  padding-top:36px;
}

/* ========== Titlebar ========== */
.titlebar{
  position:fixed;top:0;left:0;right:0;height:36px;
  background:var(--surface-container);
  display:none;z-index:100;
  -webkit-app-region:drag;align-items:center;
  justify-content:space-between;padding:0 8px;
  border-bottom:1px solid var(--outline-variant);
}
.titlebar.visible{display:flex}
.titlebar-title{
  font-family:var(--font-serif);font-size:13px;
  color:var(--on-surface-variant);margin-left:8px;font-weight:600;
}
.titlebar-btns{display:flex;gap:0;-webkit-app-region:no-drag}
.titlebar-btn{
  width:36px;height:36px;border:none;background:transparent;
  color:var(--on-surface-variant);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s;border-radius:8px;
}
.titlebar-btn:hover{background:var(--surface-container-high)}
.titlebar-btn.close:hover{background:var(--error-container);color:var(--error)}

/* ========== Content Area ========== */
.content-area{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:16px 20px 80px;
  scroll-behavior:smooth;
}
.content-area::-webkit-scrollbar{width:4px}
.content-area::-webkit-scrollbar-thumb{
  background:var(--outline-variant);border-radius:4px;
}

.page{display:none;animation:fadeIn .3s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ========== Bottom Navigation ========== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;height:64px;
  background:var(--surface-container);
  border-top:1px solid var(--outline-variant);
  display:flex;justify-content:space-around;align-items:center;
  z-index:50;padding-bottom:env(safe-area-inset-bottom);
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;padding:6px 16px;border-radius:var(--radius-full);
  transition:all .2s;color:var(--on-surface-variant);
  background:transparent;border:none;font-size:11px;font-weight:600;
  letter-spacing:0.02em;
}
.nav-item:hover{background:var(--surface-container-high)}
.nav-item.active{color:var(--primary);background:rgba(21,66,18,0.08)}
.nav-item svg{width:22px;height:22px;fill:currentColor}

/* ========== Timer Page ========== */
.mode-label{
  text-align:center;font-family:var(--font-serif);
  font-size:13px;color:var(--on-surface-variant);
  letter-spacing:4px;text-transform:uppercase;
  margin-bottom:8px;font-weight:600;
}
.mode-label.focus{color:var(--primary)}
.mode-label.break{color:var(--tertiary)}

/* Growing Plant + Ring Container */
.timer-ring-wrap{
  position:relative;width:220px;height:220px;margin:8px auto 0;
}
.timer-ring-svg{
  width:100%;height:100%;transform:rotate(-90deg);
}
.ring-bg{fill:none;stroke:var(--surface-container-highest);stroke-width:6}
.ring-progress{
  fill:none;stroke-width:6;stroke-linecap:round;
  transition:stroke-dashoffset .5s linear;
}
.ring-progress.focus{stroke:var(--primary)}
.ring-progress.break{stroke:var(--tertiary)}

/* Growing plant inside ring */
.growing-plant{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-45%);
  width:120px;height:120px;
  display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;
}
.growing-plant svg{
  width:100%;height:100%;
  transition:all .8s ease;
}
.growing-plant .plant-element{
  transition:all .8s ease;transform-origin:bottom center;
}

/* Timer display below ring */
.timer-display{
  text-align:center;margin-top:12px;
}
.timer-time{
  font-family:var(--font-serif);font-size:44px;
  font-weight:700;color:var(--on-surface);
  letter-spacing:2px;line-height:1;
}
.timer-sub{
  font-size:12px;color:var(--on-surface-variant);
  margin-top:4px;letter-spacing:1px;
}

/* Controls */
.controls{
  display:flex;gap:8px;justify-content:center;
  margin-top:16px;align-items:center;
}
.btn{
  padding:10px 24px;border:none;border-radius:var(--radius-full);
  cursor:pointer;font-size:14px;font-weight:600;
  transition:all .15s;font-family:var(--font-sans);
  letter-spacing:0.02em;
}
.btn:active{transform:scale(.96)}
.btn-primary{
  background:var(--primary);color:var(--on-primary);
  box-shadow:var(--shadow-btn);
}
.btn-primary:hover{background:#1a5515;box-shadow:var(--shadow-btn)}
.btn-primary:active{box-shadow:var(--shadow-btn-active)}
.btn-break{
  background:var(--tertiary);color:var(--on-primary);
  box-shadow:var(--shadow-btn);
}
.btn-secondary{
  background:var(--surface-container-high);color:var(--on-surface-variant);
  box-shadow:var(--shadow-1);
}
.btn-secondary:hover{background:var(--surface-container-highest)}
.btn-danger{
  background:transparent;color:var(--error);
  border:1px solid var(--error);font-size:12px;
  padding:6px 14px;
}
.btn-danger:hover{background:var(--error-container)}
.btn-sm{padding:6px 14px;font-size:12px}

/* Seed selector button */
.seed-selector{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:16px;padding:10px 20px;
  background:var(--surface-container-low);
  border:1.5px dashed var(--outline-variant);
  border-radius:var(--radius-lg);cursor:pointer;
  transition:all .2s;
}
.seed-selector:hover{
  border-color:var(--primary);background:rgba(21,66,18,0.04);
}
.seed-selector svg{width:28px;height:28px}
.seed-selector-text{
  font-size:13px;color:var(--on-surface-variant);font-weight:500;
}
.seed-selector-name{
  color:var(--primary);font-weight:600;
}
.session-info{
  text-align:center;font-size:12px;color:var(--on-surface-variant);
  margin-top:10px;
}

/* Settings */
.settings-toggle{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin-top:14px;padding:6px;cursor:pointer;
  color:var(--outline);font-size:12px;
  transition:color .2s;border:none;background:none;
  font-family:var(--font-sans);
}
.settings-toggle:hover{color:var(--on-surface-variant)}
.settings-toggle svg{width:16px;height:16px;fill:currentColor;
  transition:transform .3s;
}
.settings-toggle.open svg{transform:rotate(180deg)}

.settings-panel{
  max-height:0;overflow:hidden;
  transition:max-height .3s ease;
  margin-top:8px;
}
.settings-panel.open{max-height:200px}

.settings-card{
  background:var(--surface-container-low);
  border-radius:var(--radius);padding:12px 16px;
  border:1px solid var(--outline-variant);
}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--outline-variant);
}
.setting-row:last-child{border:none}
.setting-label{font-size:13px;color:var(--on-surface-variant)}
.setting-input{
  background:var(--surface);border:1px solid var(--outline-variant);
  color:var(--on-surface);border-radius:var(--radius-sm);
  padding:4px 8px;width:56px;text-align:center;font-size:14px;
  font-family:var(--font-sans);
}
.setting-input:focus{outline:none;border-color:var(--primary)}
.toggle-wrap{
  font-size:13px;color:var(--on-surface-variant);cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.toggle-wrap input{accent-color:var(--primary)}

/* ========== Land Page ========== */
.land-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.land-title{
  font-family:var(--font-serif);font-size:18px;font-weight:700;
  color:var(--on-surface);
}
.view-switcher{
  display:flex;background:var(--surface-container);
  border-radius:var(--radius-full);padding:2px;
  border:1px solid var(--outline-variant);
}
.view-btn{
  padding:5px 14px;border:none;border-radius:var(--radius-full);
  font-size:12px;font-weight:600;cursor:pointer;
  transition:all .2s;background:transparent;
  color:var(--on-surface-variant);font-family:var(--font-sans);
}
.view-btn.active{
  background:var(--primary);color:var(--on-primary);
  box-shadow:var(--shadow-1);
}

/* Day View - 2.5D Isometric */
.day-view{display:block}
.day-date{
  font-size:13px;color:var(--on-surface-variant);
  text-align:center;margin-bottom:6px;font-weight:500;
}
/* Shared isometric land wrapper */
.iso-land-wrap{
  display:flex;justify-content:center;align-items:center;
  padding:30px 10px 30px;
  position:relative;
  overflow:visible;
  background:radial-gradient(ellipse at 50% 45%,#1d5043 0%,#143d33 35%,#0e2e26 65%,#092420 100%);
  border-radius:var(--radius-lg);
  min-height:380px;
}
.iso-land-wrap::before{content:none}
.iso-land-wrap::after{content:none}
/* Isometric diamond land - 2D projected approach */
.land-grid{
  position:relative;
  width:280px;
  height:160px;
  overflow:visible;
}
/* Diamond top face (grass) */
.land-grid::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:100%;
  background:
    radial-gradient(circle at 30% 40%,#c8f06e 0%,transparent 35%),
    radial-gradient(circle at 70% 60%,#8ccf52 0%,transparent 30%),
    radial-gradient(circle at 55% 25%,#b5e84d 0%,transparent 25%),
    linear-gradient(160deg,#b5e550 0%,#8bc34a 30%,#6aad3a 60%,#5a9a32 100%);
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  z-index:1;
}
/* Soil faces hidden */
.land-grid::after{display:none}
.land-grid-soil-left{display:none}
/* No corner needed with 2D approach */
.land-grid-soil-corner{display:none}
/* Entity cells positioned within the diamond via isometric coordinate mapping */
.land-cell{
  position:absolute;
  width:60px;
  height:60px;
  transform:translate(-50%,-50%);
  transition:transform .3s ease, left 2.8s ease-in-out, top 2.8s ease-in-out;
  z-index:2;
}
.land-cell:hover{transform:translate(-50%,-50%) scale(1.06)}
.land-cell.has-tree,
.land-cell.has-animal,
.land-cell.empty,
.land-cell.dead{
  background:transparent;
  border:none;
  box-shadow:none;
}
.land-cell.dead{opacity:.78}
.land-cell.is-roaming{z-index:3}

/* Entity sprite */
.tree-on-cell{
  position:absolute;
  left:50%;
  bottom:0;
  width:80px;
  height:100px;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  transform:translateX(-50%);
  transform-origin:bottom center;
  z-index:2;
  pointer-events:none;
}
/* Entity ground shadow on grass */
.tree-ground-shadow{
  position:absolute;
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
  width:32px;
  height:10px;
  background:rgba(34,70,29,0.22);
  border-radius:50%;
  filter:blur(2px);
  z-index:1;
  pointer-events:none;
}
.tree-on-cell svg{
  width:100%;
  height:100%;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,0.22));
  transition:transform .3s ease;
}
.land-cell:hover .tree-on-cell svg{transform:scale(1.06)}
.land-cell.dead .tree-on-cell svg{
  filter:saturate(0.3) brightness(0.8) drop-shadow(1px 2px 3px rgba(0,0,0,0.15));
}
.land-cell.dead .tree-ground-shadow{opacity:.5}
/* Small grass dots on empty tiles */
.cell-grass-dot{
  position:absolute;
  width:2px;height:5px;
  background:#8cb870;
  border-radius:0 0 1px 1px;
  z-index:1;opacity:.35;
  animation:grassGrow 2s ease-out forwards;
  transform-origin:bottom center;
}
@keyframes grassGrow{0%{transform:scaleY(0)}100%{transform:scaleY(1)}}
/* Fence decoration around the land */
.land-fence{
  position:absolute;
  border:3px solid rgba(139,115,85,0.2);
  border-radius:18px;
  pointer-events:none;
  box-shadow:
    inset 0 0 0 1px rgba(200,180,140,0.3),
    0 0 0 1px rgba(139,115,85,0.08);
}
.tree-sway{animation:treeSway 4s ease-in-out infinite;transform-origin:bottom center}
.tree-pop{animation:treePop .6s cubic-bezier(.34,1.56,.64,1) forwards;transform-origin:bottom center}
@keyframes treeSway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes treePop{0%{transform:scaleY(0) scaleX(0.5);opacity:0}60%{transform:scaleY(1.15) scaleX(1.05)}100%{transform:scaleY(1) scaleX(1);opacity:1}}
/* Floating ambient particles */
.land-particles{
  position:absolute;
  inset:-20px;
  pointer-events:none;
  z-index:15;
  overflow:visible;
}
.land-particle{
  position:absolute;
  border-radius:50%;
  opacity:0;
  animation:particleDrift 6s ease-in-out infinite;
}
@keyframes particleDrift{
  0%{transform:translate(0,0) scale(0);opacity:0}
  20%{opacity:.6}
  80%{opacity:.4}
  100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}
}
/* Leaf particle */
.leaf-particle{
  width:4px;height:6px;
  border-radius:50% 0 50% 0;
  transform-origin:center;
}
/* Sparkle particle */
.sparkle-particle{
  width:3px;height:3px;
  background:#f5e6b8;
  box-shadow:0 0 3px rgba(245,230,184,0.5);
}
.day-summary{
  text-align:center;margin-top:8px;
  font-size:12px;color:var(--on-surface-variant);
}
.day-summary strong{color:var(--primary);font-weight:600}

/* Month View - Isometric Land */
.month-view{display:none}
.month-nav{
  display:flex;align-items:center;justify-content:center;gap:16px;
  margin-bottom:12px;
}
.month-nav-btn{
  width:32px;height:32px;border:none;border-radius:var(--radius-full);
  background:var(--surface-container-high);color:var(--on-surface-variant);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-size:16px;
}
.month-nav-btn:hover{background:var(--surface-container-highest)}
.month-label{
  font-family:var(--font-serif);font-size:16px;font-weight:600;
  color:var(--on-surface);
}
/* Month land uses shared .iso-land-wrap style */
.month-land-wrap{
  display:flex;justify-content:center;align-items:center;
  padding:30px 10px 50px;
  position:relative;
  overflow:visible;
  background:radial-gradient(ellipse at 50% 45%,#1d5043 0%,#143d33 35%,#0e2e26 65%,#092420 100%);
  border-radius:var(--radius-lg);
  min-height:380px;
}
.month-land-wrap::before{
  content:'';position:absolute;
  bottom:8px;left:20%;right:20%;height:30px;
  background:radial-gradient(ellipse,rgba(0,0,0,0.2) 0%,transparent 70%);
  filter:blur(10px);pointer-events:none;
}
.month-land-grid{
  position:relative;
  width:300px;
  height:172px;
  overflow:visible;
}
.month-land-grid::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:100%;
  background:
    radial-gradient(circle at 30% 40%,#c8f06e 0%,transparent 35%),
    radial-gradient(circle at 70% 60%,#8ccf52 0%,transparent 30%),
    radial-gradient(circle at 55% 25%,#b5e84d 0%,transparent 25%),
    linear-gradient(160deg,#b5e550 0%,#8bc34a 30%,#6aad3a 60%,#5a9a32 100%);
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  z-index:1;
}
.month-land-grid::after{display:none}
.month-land-soil-left{display:none}
/* Month entities on land */
.month-entity{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:2;
  pointer-events:none;
}
.month-entity svg{
  filter:drop-shadow(0.5px 1.5px 2px rgba(0,0,0,0.18));
}
.month-entity.dead-entity{opacity:.6}
.month-stats{
  margin-top:8px;display:flex;justify-content:space-around;
}
.month-stat{
  text-align:center;
}
.month-stat-val{
  font-family:var(--font-serif);font-size:20px;
  font-weight:700;color:var(--primary);
}
.month-stat-label{font-size:10px;color:var(--outline);margin-top:2px}

/* Year View - Isometric Land */
.year-view{display:none}
.year-label{
  font-family:var(--font-serif);font-size:18px;font-weight:700;
  text-align:center;margin-bottom:12px;color:var(--on-surface);
}
/* Year land uses same dark bg style */
.year-land-wrap{
  display:flex;justify-content:center;align-items:center;
  padding:30px 10px 50px;
  position:relative;
  overflow:visible;
  background:radial-gradient(ellipse at 50% 45%,#1d5043 0%,#143d33 35%,#0e2e26 65%,#092420 100%);
  border-radius:var(--radius-lg);
  min-height:380px;
}
.year-land-wrap::before{
  content:'';position:absolute;
  bottom:8px;left:20%;right:20%;height:30px;
  background:radial-gradient(ellipse,rgba(0,0,0,0.2) 0%,transparent 70%);
  filter:blur(10px);pointer-events:none;
}
.year-land-grid{
  position:relative;
  width:320px;
  height:183px;
  overflow:visible;
}
.year-land-grid::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;
  height:100%;
  background:
    radial-gradient(circle at 30% 40%,#c8f06e 0%,transparent 35%),
    radial-gradient(circle at 70% 60%,#8ccf52 0%,transparent 30%),
    radial-gradient(circle at 55% 25%,#b5e84d 0%,transparent 25%),
    linear-gradient(160deg,#b5e550 0%,#8bc34a 30%,#6aad3a 60%,#5a9a32 100%);
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  z-index:1;
}
.year-land-grid::after{display:none}
.year-land-soil-left{display:none}
/* Year entities on land */
.year-entity{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:2;
  pointer-events:none;
}
.year-entity svg{
  filter:drop-shadow(0.5px 1px 1.5px rgba(0,0,0,0.15));
}
.year-entity.dead-entity{opacity:.5}
.year-stats{
  margin-top:8px;display:flex;justify-content:space-around;
}
.year-stat{
  text-align:center;
}
.year-stat-val{
  font-family:var(--font-serif);font-size:20px;
  font-weight:700;color:var(--primary);
}
.year-stat-label{font-size:10px;color:var(--outline);margin-top:2px}

/* ========== Stats Page ========== */
.stats-greeting{
  font-family:var(--font-serif);font-size:20px;font-weight:700;
  margin-bottom:16px;color:var(--on-surface);
}
.stats-today-card{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-container) 100%);
  border-radius:var(--radius-lg);padding:20px;
  color:var(--on-primary);margin-bottom:16px;
  box-shadow:var(--shadow-2);
}
.stats-today-label{font-size:12px;opacity:.8;margin-bottom:4px}
.stats-today-vals{
  display:flex;justify-content:space-around;
}
.stats-today-item{text-align:center}
.stats-today-num{
  font-family:var(--font-serif);font-size:28px;font-weight:700;
}
.stats-today-unit{font-size:11px;opacity:.7;margin-top:2px}

.stats-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-bottom:16px;
}
.stats-card{
  background:var(--surface-container-low);
  border-radius:var(--radius-md);padding:14px;
  border:1px solid var(--outline-variant);
  text-align:center;
}
.stats-card-val{
  font-family:var(--font-serif);font-size:22px;
  font-weight:700;color:var(--primary);
}
.stats-card-label{
  font-size:11px;color:var(--on-surface-variant);margin-top:4px;
}

/* Achievements section */
.achievements-title{
  font-family:var(--font-serif);font-size:16px;font-weight:600;
  margin-bottom:10px;color:var(--on-surface);
}
.achievements-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-bottom:16px;
}
.achievement-card{
  background:var(--surface-container-low);
  border-radius:var(--radius);padding:12px;
  border:1px solid var(--outline-variant);
  display:flex;align-items:center;gap:10px;
  transition:all .2s;
}
.achievement-card.unlocked{
  border-color:var(--inverse-primary);
  background:rgba(161,212,148,0.08);
}
.achievement-card.locked{opacity:.6}
.achievement-icon{font-size:24px}
.achievement-info{flex:1;min-width:0}
.achievement-name{font-size:12px;font-weight:600;color:var(--on-surface)}
.achievement-desc{font-size:10px;color:var(--on-surface-variant);margin-top:2px}
.achievement-check{color:var(--primary);font-size:16px}
.achievement-lock{color:var(--outline);font-size:14px}

.stats-footer{
  text-align:center;margin-top:8px;
}

/* ========== Tree Selector Modal ========== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(27,28,26,0.5);
  z-index:200;display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-overlay.show{display:flex}

.modal-sheet{
  background:var(--surface);border-radius:var(--radius-xl) var(--radius-xl) 0 0;
  width:100%;max-height:80vh;overflow-y:auto;
  padding:20px 20px 32px;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

.modal-handle{
  width:36px;height:4px;background:var(--outline-variant);
  border-radius:2px;margin:0 auto 16px;
}
.modal-title{
  font-family:var(--font-serif);font-size:18px;font-weight:700;
  color:var(--on-surface);margin-bottom:16px;text-align:center;
}

.tree-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
}
.tree-card{
  background:var(--surface-container-low);
  border-radius:var(--radius-md);padding:14px;
  border:2px solid var(--outline-variant);
  cursor:pointer;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;
  gap:6px;position:relative;
}
.tree-card:hover{border-color:var(--outline);background:var(--surface-container)}
.tree-card.selected{
  border-color:var(--primary);background:rgba(21,66,18,0.04);
  box-shadow:0 0 0 1px var(--primary);
}
.tree-card.locked{
  opacity:.5;cursor:not-allowed;
  filter:grayscale(0.8);
}
.tree-card.locked:hover{border-color:var(--outline-variant);background:var(--surface-container-low)}
.tree-card-svg{width:48px;height:48px}
.tree-card-name{font-size:13px;font-weight:600;color:var(--on-surface)}
.tree-card-unlock{
  font-size:10px;color:var(--outline);
  display:flex;align-items:center;gap:3px;
}
.tree-card-lock{
  position:absolute;top:8px;right:8px;
  width:16px;height:16px;color:var(--outline);
}

/* ========== Achievement Unlock Modal ========== */
.unlock-overlay{
  position:fixed;inset:0;background:rgba(27,28,26,0.7);
  z-index:300;display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.unlock-overlay.show{display:flex}

.unlock-card{
  background:var(--surface);border-radius:var(--radius-xl);
  padding:32px 24px;text-align:center;max-width:280px;
  animation:unlockPop .5s cubic-bezier(.34,1.56,.64,1);
  box-shadow:var(--shadow-3);
  position:relative;overflow:hidden;
}
@keyframes unlockPop{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}
.unlock-card::before{
  content:'';position:absolute;inset:-50%;
  background:conic-gradient(from 0deg,transparent,rgba(161,212,148,0.3),transparent,rgba(200,159,24,0.2),transparent);
  animation:unlockSpin 3s linear infinite;
}
@keyframes unlockSpin{to{transform:rotate(360deg)}}
.unlock-inner{position:relative;z-index:1}
.unlock-label{
  font-size:12px;color:var(--on-surface-variant);
  letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;font-weight:600;
}
.unlock-tree-svg{width:72px;height:72px;margin:8px auto}
.unlock-tree-name{
  font-family:var(--font-serif);font-size:20px;font-weight:700;
  color:var(--primary);margin:8px 0 4px;
}
.unlock-desc{
  font-size:13px;color:var(--on-surface-variant);
  line-height:1.5;margin-bottom:16px;
}

/* Particles */
.particles{
  position:absolute;inset:0;pointer-events:none;z-index:0;
}
.particle{
  position:absolute;width:6px;height:6px;border-radius:50%;
  animation:particleFloat 2s ease-out forwards;
}
@keyframes particleFloat{
  0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}
}

/* ========== Abandon Confirm Modal ========== */
.confirm-overlay{
  position:fixed;inset:0;background:rgba(27,28,26,0.5);
  z-index:250;display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
}
.confirm-overlay.show{display:flex}
.confirm-card{
  background:var(--surface);border-radius:var(--radius-lg);
  padding:24px;text-align:center;max-width:280px;
  box-shadow:var(--shadow-3);
}
.confirm-icon{font-size:40px;margin-bottom:8px}
.confirm-title{
  font-family:var(--font-serif);font-size:16px;font-weight:700;
  color:var(--on-surface);margin-bottom:6px;
}
.confirm-desc{
  font-size:13px;color:var(--on-surface-variant);
  line-height:1.5;margin-bottom:16px;
}
.confirm-btns{display:flex;gap:8px;justify-content:center}

/* ========== Toast ========== */
.toast{
  position:fixed;top:48px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:var(--primary-container);color:var(--on-primary);
  padding:10px 20px;border-radius:var(--radius-full);
  font-size:13px;font-weight:500;z-index:400;
  opacity:0;transition:all .3s;pointer-events:none;
  box-shadow:var(--shadow-2);white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== Animations ========== */
@keyframes sway{
  0%,100%{transform:rotate(-1.5deg)}
  50%{transform:rotate(1.5deg)}
}
.sway{animation:sway 3s ease-in-out infinite;transform-origin:bottom center}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.pulse{animation:pulse 2s ease-in-out infinite}

@keyframes growUp{
  from{transform:scaleY(0);transform-origin:bottom}
  to{transform:scaleY(1);transform-origin:bottom}
}

/* ========== Mobile Responsive ========== */
@media (max-width: 500px) {
  html, body {
    height: 100dvh;
    overflow: hidden;
  }
  body {
    padding-top: 0;
    padding-bottom: calc(64px + env(safe-area-inset-bottom));
  }
  /* Hide Electron titlebar on mobile */
  .titlebar { display: none !important; }
  /* Content area fills screen minus bottom nav */
  .content-area {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 8px;
  }
  /* Bottom nav mobile style */
  .bottom-nav {
    height: calc(64px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    min-height: 44px;
    -webkit-tap-highlight-color: transparent;
  }
  /* Timer page adjustments */
  .timer-ring-wrap { 
    margin: 16px auto 4px;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .timer-ring-svg { width: 180px; height: 180px; }
  .growing-plant {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 98px;
    height: 98px;
  }
  .timer-time { font-size: 36px; }
  .controls { gap: 8px; }
  .btn { min-height: 44px; font-size: 14px; }
  .seed-selector { min-height: 44px; }
  /* Settings toggle */
  .settings-toggle { min-height: 44px; }
  .setting-row { min-height: 44px; }

  /* ===== Isometric Land - Day View Mobile ===== */
  .iso-land-wrap {
    padding: 24px 4px 40px;
    min-height: 300px;
  }
  .land-grid {
    width: 240px;
    height: 138px;
  }
  .land-grid::after { display: none; }
  .land-grid-soil-left { display: none; }
  .land-cell {
    width: 46px;
    height: 46px;
  }
  .land-cell:hover { transform: translate(-50%,-50%) scale(1.05); }
  .tree-on-cell {
    width: 64px;
    height: 80px;
  }
  .tree-ground-shadow {
    width: 20px;
    height: 6px;
    bottom: 1px;
  }

  /* ===== Month View Mobile ===== */
  .month-land-wrap { padding: 24px 4px 40px; min-height: 300px; }
  .month-land-grid { width: 250px; height: 143px; }
  .month-land-grid::after { display: none; }
  .month-land-soil-left { display: none; }

  /* ===== Year View Mobile ===== */
  .year-land-wrap { padding: 24px 4px 40px; min-height: 300px; }
  .year-land-grid { width: 270px; height: 154px; }
  .year-land-grid::after { display: none; }
  .year-land-soil-left { display: none; }

  /* ===== Stats Page Mobile ===== */
  .stats-today-card {
    padding: 16px;
  }
  .stats-today-num { font-size: 40px; }

  /* ===== Modal adjustments ===== */
  .modal-sheet {
    max-height: 70vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .tree-grid {
    grid-template-columns: repeat(3, 1fr);
  }
  .tree-card { min-height: 80px; }
  .tree-card:active { transform: scale(0.95); }

  /* Toast position */
  .toast { top: env(safe-area-inset-top, 12px); }
}

/* Very small screens (iPhone SE, etc.) */
@media (max-width: 375px) {
  .land-grid {
    width: 200px;
    height: 115px;
  }
  .land-cell { width: 38px; height: 38px; }
  .month-land-grid { width: 200px; height: 115px; }
  .year-land-grid { width: 210px; height: 120px; }
  .timer-ring-svg { width: 160px; height: 160px; }
  .timer-time { font-size: 32px; }
}

/* Landscape phone - use side-by-side layout */
@media (max-height: 500px) and (orientation: landscape) {
  .content-area { padding-bottom: 0; }
  .bottom-nav { height: 50px; }
  body { padding-bottom: 50px; }
  .timer-ring-svg { width: 140px; height: 140px; }
  .timer-time { font-size: 28px; }
  .iso-land-wrap { padding: 10px 4px 20px; min-height: 220px; }
  .land-grid { width: 180px; height: 103px; }
  .land-grid::after { display: none; }
  .land-grid-soil-left { display: none; }
  .month-land-wrap { padding: 10px 4px 20px; min-height: 220px; }
  .month-land-grid { width: 180px; height: 103px; }
  .year-land-wrap { padding: 10px 4px 20px; min-height: 220px; }
  .year-land-grid { width: 190px; height: 109px; }
}

</style>
</head>
<body>

<!-- ========== Titlebar ========== -->
<div class="titlebar" id="titlebar">
  <span class="titlebar-title">🌿 专注丛林</span>
  <div class="titlebar-btns">
    <button class="titlebar-btn" onclick="window.electronAPI&&window.electronAPI.minimize()">&#9725;</button>
    <button class="titlebar-btn close" onclick="window.electronAPI&&window.electronAPI.close()">&#10005;</button>
  </div>
</div>

<!-- ========== Content ========== -->
<div class="content-area">

  <!-- ===== Timer Page ===== -->
  <div id="page-timer" class="page active">
    <div class="mode-label focus" id="modeLabel">专 注 模 式</div>

    <div class="timer-ring-wrap">
      <svg class="timer-ring-svg" width="220" height="220" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="100"/>
        <circle class="ring-progress focus" id="progressRing" cx="110" cy="110" r="100"
          stroke-dasharray="628.32" stroke-dashoffset="0"/>
        <!-- Leaf at progress end -->
        <g id="progressLeaf" transform="rotate(-90 110 110)" opacity="0">
          <path d="M0,-4 Q4,-8 0,-12 Q-4,-8 0,-4" fill="var(--inverse-primary)" transform="translate(110,10)"/>
        </g>
      </svg>
      <div class="growing-plant" id="growingPlant">
        <!-- Dynamic plant SVG injected by JS -->
      </div>
    </div>

    <div class="timer-display">
      <div class="timer-time" id="timerTime">25:00</div>
      <div class="timer-sub" id="timerSub">点击开始专注</div>
    </div>

    <div class="controls" id="controlsArea">
      <button class="btn btn-primary" id="btnStart" onclick="toggleTimer()">开始专注</button>
      <button class="btn btn-secondary" id="btnReset" onclick="resetTimer()" style="display:none">重置</button>
    </div>

    <div class="seed-selector" id="seedSelector" onclick="openTreeModal()">
      <svg viewBox="0 0 28 28" id="seedSelectorIcon">
        <circle cx="14" cy="22" rx="8" ry="3" fill="#8B7355" opacity=".3"/>
        <rect x="12.5" y="14" width="3" height="9" rx="1" fill="#8B6914"/>
        <circle cx="14" cy="10" r="7" fill="#3a9e4f"/>
        <circle cx="10" cy="11" r="4.5" fill="#4ab85f"/>
        <circle cx="18" cy="11" r="4.5" fill="#4ab85f"/>
      </svg>
      <div>
        <div class="seed-selector-text">选择树种</div>
        <div class="seed-selector-name" id="selectedTreeName">小橡树</div>
      </div>
    </div>
    <div class="session-info" id="sessionInfo">今日已专注 0 次</div>

    <button class="settings-toggle" id="settingsToggle" onclick="toggleSettings()">
      <svg viewBox="0 0 16 16"><path d="M8 11L3 6h10l-5 5z"/></svg>
      设置
    </button>
    <div class="settings-panel" id="settingsPanel">
      <div class="settings-card">
        <div class="setting-row">
          <span class="setting-label">🎯 专注时长（分钟）</span>
          <input class="setting-input" id="focusMin" type="number" min="1" max="120" value="25" onchange="onSettingChange()">
        </div>
        <div class="setting-row">
          <span class="setting-label">☕ 休息时长（分钟）</span>
          <input class="setting-input" id="breakMin" type="number" min="1" max="60" value="5" onchange="onSettingChange()">
        </div>
        <div class="setting-row">
          <span class="setting-label">🔔 提示音</span>
          <label class="toggle-wrap"><input type="checkbox" id="soundToggle" checked> 开启</label>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Land Page ===== -->
  <div id="page-land" class="page">
    <div class="land-header">
      <div class="land-title">我的丛林</div>
      <div class="view-switcher">
        <button class="view-btn active" onclick="switchLandView('day',this)">日</button>
        <button class="view-btn" onclick="switchLandView('month',this)">月</button>
        <button class="view-btn" onclick="switchLandView('year',this)">年</button>
      </div>
    </div>

    <!-- Day View -->
    <div id="landDay" class="day-view">
      <div class="day-date" id="dayDate"></div>
      <div class="iso-land-wrap">
        <div class="land-grid" id="landGrid">
          <div class="land-grid-soil-left"></div>
        </div>
        <div class="land-particles" id="landParticles"></div>
      </div>
      <div class="day-summary" id="daySummary"></div>
    </div>

    <!-- Month View -->
    <div id="landMonth" class="month-view">
      <div class="month-nav">
        <button class="month-nav-btn" onclick="changeMonth(-1)">‹</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="month-nav-btn" onclick="changeMonth(1)">›</button>
      </div>
      <div class="month-land-wrap">
        <div class="month-land-grid" id="monthGrid">
          <div class="month-land-soil-left"></div>
        </div>
      </div>
      <div class="month-stats" id="monthStats"></div>
    </div>

    <!-- Year View -->
    <div id="landYear" class="year-view">
      <div class="year-label" id="yearLabel"></div>
      <div class="year-land-wrap">
        <div class="year-land-grid" id="yearGrid">
          <div class="year-land-soil-left"></div>
        </div>
      </div>
      <div class="year-stats" id="yearStats"></div>
    </div>
  </div>

  <!-- ===== Stats Page ===== -->
  <div id="page-stats" class="page">
    <div class="stats-greeting" id="statsGreeting">专注成就</div>

    <div class="stats-today-card">
      <div class="stats-today-label" id="statsTodayLabel">今天</div>
      <div class="stats-today-vals">
        <div class="stats-today-item">
          <div class="stats-today-num" id="statTodayTrees">0</div>
          <div class="stats-today-unit">次专注</div>
        </div>
        <div class="stats-today-item">
          <div class="stats-today-num" id="statTodayMin">0</div>
          <div class="stats-today-unit">分钟</div>
        </div>
        <div class="stats-today-item">
          <div class="stats-today-num" id="statStreak">0</div>
          <div class="stats-today-unit">天连续</div>
        </div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stats-card">
        <div class="stats-card-val" id="statTotalTrees">0</div>
        <div class="stats-card-label">🌳 累计种树</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-val" id="statTotalAnimals">0</div>
        <div class="stats-card-label">🐾 累计动物</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-val" id="statTotalMin">0</div>
        <div class="stats-card-label">⏳ 累计分钟</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-val" id="statDeadTrees">0</div>
        <div class="stats-card-label">🥀 枯萎/逃跑</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-val" id="statUnlocked">0</div>
        <div class="stats-card-label">🌱 已解锁</div>
      </div>
    </div>

    <div class="achievements-title">🌿 丛林图鉴</div>
    <div class="achievements-grid" id="achievementsGrid"></div>

    <div class="stats-footer">
      <button class="btn btn-danger btn-sm" onclick="confirmResetData()">清除所有数据</button>
    </div>
  </div>

</div>

<!-- ========== Bottom Navigation ========== -->
<div class="bottom-nav">
  <button class="nav-item active" onclick="switchTab('timer',this)">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
    专注
  </button>
  <button class="nav-item" onclick="switchTab('land',this)">
    <svg viewBox="0 0 24 24"><path d="M12 22C6.48 22 2 17.52 2 12S6.48 2 12 2s10 4.48 10 10-4.48 10-10 10zm0-18c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8zm-1 14h2v-4h-2v4zm0-6h2V6h-2v6z"/><path d="M6 20c1-3 3-6 6-6s5 3 6 6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="10" r="2"/></svg>

  </button>
  <button class="nav-item" onclick="switchTab('stats',this)">
    <svg viewBox="0 0 24 24"><path d="M19 5h-2V3h-2v2h-2V3h-2v2H9V3H7v2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 14H5V7h14v12zM7 10h2v6H7zm4-2h2v8h-2zm4 4h2v4h-2z"/></svg>
    成就
  </button>
</div>

<!-- ========== Tree Selector Modal ========== -->
<div class="modal-overlay" id="treeModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">选择伙伴</div>
    <div class="tree-grid" id="treeGrid"></div>
  </div>
</div>

<!-- ========== Achievement Unlock Modal ========== -->
<div class="unlock-overlay" id="unlockModal">
  <div class="unlock-card">
    <div class="particles" id="unlockParticles"></div>
    <div class="unlock-inner">
      <div class="unlock-label">新 树 种 解 锁</div>
      <div class="unlock-tree-svg" id="unlockTreeSvg"></div>
      <div class="unlock-tree-name" id="unlockTreeName"></div>
      <div class="unlock-desc" id="unlockTreeDesc"></div>
      <button class="btn btn-primary" onclick="closeUnlockModal()">太棒了！</button>
    </div>

</div>

<!-- ========== Abandon Confirm Modal ========== -->
<div class="confirm-overlay" id="abandonModal">
  <div class="confirm-card">

// ============================================================
// STATE
// ============================================================
let state = {
  focusMin: 25, breakMin: 5,
  mode: 'focus',
  running: false, paused: false,
  remaining: 25*60, total: 25*60,
  selectedEntity: { category: 'tree', id: 'oak' },
  entities: [],    // { category, type, date, ts, dead, failed, posX, posY }
  history: {},     // { 'YYYY-MM-DD': { trees, minutes, deadTrees, animals, escapedAnimals } }
  totalFocusMinutes: 0,
  unlockedTrees: ['grass','oak'],
  unlockedAnimals: ['rhino'],
  seenUnlocks: [],
};

// Month view state
let viewMonth = new Date().getMonth();
let viewYear = new Date().getFullYear();

// ============================================================
// PERSISTENCE
// ============================================================
function save() {
  localStorage.setItem('focusJungleV3', JSON.stringify(state));
}

function load() {
  try {
    // 1. Try loading V3
    const v3 = JSON.parse(localStorage.getItem('focusJungleV3'));
    if (v3 && v3.entities) {
      state.focusMin = v3.focusMin || 25;
      state.breakMin = v3.breakMin || 5;
      state.selectedEntity = v3.selectedEntity || { category: 'tree', id: 'oak' };
      state.entities = (v3.entities || []).map(e => ensureEntityPosition(e));
      state.history = v3.history || {};
      state.totalFocusMinutes = v3.totalFocusMinutes || 0;
      state.unlockedTrees = v3.unlockedTrees || ['grass','oak'];
      state.unlockedAnimals = v3.unlockedAnimals || ['rhino'];
      state.seenUnlocks = v3.seenUnlocks || [];
      state.mode = 'focus';
      state.running = false;
      state.paused = false;
      state.remaining = state.focusMin * 60;
      state.total = state.focusMin * 60;
      return;
    }

    // 2. Try migrating from V2
    const v2 = JSON.parse(localStorage.getItem('focusForestV2'));
    if (v2 && v2.trees) {
      state.focusMin = v2.focusMin || 25;
      state.breakMin = v2.breakMin || 5;
      state.selectedEntity = { category: 'tree', id: v2.selectedTree || 'oak' };
      state.entities = (v2.trees || []).map(t => ensureEntityPosition({
        category: 'tree', type: t.type, date: t.date, ts: t.ts, dead: t.dead, failed: false
      }));
      state.history = v2.history || {};
      state.totalFocusMinutes = v2.totalFocusMinutes || 0;
      state.unlockedTrees = v2.unlockedTrees || ['grass','oak'];
      state.unlockedAnimals = ['rhino'];
      state.seenUnlocks = v2.seenUnlocks || [];
      state.mode = 'focus';
      state.running = false;
      state.paused = false;
      state.remaining = state.focusMin * 60;
      state.total = state.focusMin * 60;
      localStorage.removeItem('focusForestV2');
      save();
      return;
    }

    // 3. Try migrating from V1 format
    const old = JSON.parse(localStorage.getItem('focusForest'));
    if (old) {
      const emojiMap = {'🌲':'fir','🌳':'oak','🎄':'fir','🌴':'cactus','🎋':'bamboo','🪻':'cherry'};
      state.focusMin = old.focusMin || 25;
      state.breakMin = old.breakMin || 5;
      state.entities = (old.trees||[]).map(t => ensureEntityPosition({
        category: 'tree', type: emojiMap[t.emoji] || 'oak',
        date: t.date, ts: t.ts, dead: false, failed: false
      }));
      state.selectedEntity = { category: 'tree', id: emojiMap[old.selectedTree] || 'oak' };
      state.history = old.history || {};
      let totalMin = 0;
      for (const k in state.history) totalMin += state.history[k].minutes || 0;
      state.totalFocusMinutes = totalMin;
      checkUnlocks(true);
      localStorage.removeItem('focusForest');
      save();
    }
  } catch(e) { console.error('Load error', e); }
}

function today() {
  return new Date().toISOString().slice(0,10);
}

function genRandomPosition(category) {
  // Generate random position inside the isometric diamond
  // Diamond constraint: |x-50|/50 + |y-50|/50 <= 1
  // Use rejection sampling with inset padding
  const pad = category === 'animal' ? 14 : 12;
  let posX, posY;
  for (let i = 0; i < 20; i++) {
    posX = pad + Math.random() * (100 - pad * 2);
    posY = pad + Math.random() * (100 - pad * 2);
    // Check if inside diamond (with padding)
    const dx = Math.abs(posX - 50) / (50 - pad);
    const dy = Math.abs(posY - 50) / (50 - pad);
    if (dx + dy <= 1) break;
  }
  return { posX, posY };
}

function ensureEntityPosition(entity) {
  const next = { ...entity };
  if (typeof next.posX !== 'number' || typeof next.posY !== 'number') {
    const p = genRandomPosition(next.category || 'tree');
    next.posX = p.posX;
    next.posY = p.posY;
  }
  // Clamp to diamond area
  next.posX = Math.max(10, Math.min(90, next.posX));
  next.posY = Math.max(12, Math.min(88, next.posY));
  // Verify inside diamond, if not move toward center
  const dx = Math.abs(next.posX - 50) / 40;
  const dy = Math.abs(next.posY - 50) / 38;
  if (dx + dy > 1) {
    next.posX = next.posX * 0.7 + 50 * 0.3;
    next.posY = next.posY * 0.7 + 50 * 0.3;
  }
  return next;
}

// ============================================================
// GAMIFICATION
// ============================================================
function checkUnlocks(silent) {
  let newUnlocks = [];
  TREE_TYPES.forEach(t => {
    if (state.totalFocusMinutes >= t.unlockMinutes && !state.unlockedTrees.includes(t.id)) {
      state.unlockedTrees.push(t.id);
      newUnlocks.push({ ...t, category: 'tree' });
    }
  });
  ANIMAL_TYPES.forEach(a => {
    if (state.totalFocusMinutes >= a.unlockMinutes && !state.unlockedAnimals.includes(a.id)) {
      state.unlockedAnimals.push(a.id);
      newUnlocks.push({ ...a, category: 'animal' });
    }
  });
  if (!silent && newUnlocks.length > 0) {
    newUnlocks.forEach(item => {
      const unlockKey = item.category + '_' + item.id;
      if (!state.seenUnlocks.includes(unlockKey)) {
        showUnlockModal(item, item.category);
        state.seenUnlocks.push(unlockKey);
      }
    });
    save();
  }
}

function isEntityUnlocked(category, id) {
  if (category === 'tree') return state.unlockedTrees.includes(id);
  if (category === 'animal') return state.unlockedAnimals.includes(id);
  return false;
}

// Legacy compatibility wrappers
function isTreeUnlocked(treeId) {
  return isEntityUnlocked('tree', treeId);
}

function getEntityDef(category, id) {
  if (category === 'tree') return TREE_TYPES.find(t => t.id === id);
  if (category === 'animal') return ANIMAL_TYPES.find(a => a.id === id);
  return null;
}

function getTreeDef(treeId) {
  return getEntityDef('tree', treeId);
}

function normalizeAnimalState() {
  const validAnimalIds = new Set(ANIMAL_TYPES.map(a => a.id));
  state.unlockedAnimals = (state.unlockedAnimals || []).filter(id => validAnimalIds.has(id));
  if (state.unlockedAnimals.length === 0) state.unlockedAnimals = ['rhino'];

  if (state.selectedEntity.category === 'animal' && !validAnimalIds.has(state.selectedEntity.id)) {
    state.selectedEntity = { category: 'animal', id: state.unlockedAnimals[0] };
  }

  let entitiesChanged = false;
  state.entities = state.entities.map(entity => {
    if ((entity.category || 'tree') !== 'animal') return entity;
    if (validAnimalIds.has(entity.type)) return entity;
    entitiesChanged = true;
    return { ...entity, type: 'rhino' };
  });

  if (entitiesChanged) save();
}

function getEntitySvg(category, id, failed) {
  if (category === 'tree') {
    if (failed) return DEAD_TREE_SVG;
    const def = getEntityDef('tree', id);
    return def ? def.svg : TREE_TYPES[1].svg;
  }
  if (category === 'animal') {
    if (failed) return ESCAPED_ANIMAL_SVG;
    const def = getEntityDef('animal', id);
    return def ? def.svg : ANIMAL_TYPES[0].svg;
  }
  return '';
}

function getTreeSvg(treeId, dead) {
  return getEntitySvg('tree', treeId, dead);
}

// TIMER
// ============================================================
let timerInterval = null;
let animalRoamTimer = null;

function toggleTimer() {
  if (state.running) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  state.running = true;
  state.paused = false;
  const btn = document.getElementById('btnStart');
  btn.textContent = '暂停';
  btn.className = 'btn btn-secondary';
  document.getElementById('timerSub').textContent = state.mode === 'focus' ? '正在专注中…' : '休息中…';
  const secondaryBtn = document.getElementById('btnReset');
  secondaryBtn.style.display = '';
  secondaryBtn.textContent = state.mode === 'break' ? '结束' : '重置';
  document.getElementById('seedSelector').style.pointerEvents = 'none';
  document.getElementById('seedSelector').style.opacity = '.5';

  // Request wake lock to prevent screen from sleeping
  requestWakeLock();
  // Request notification permission on first start
  requestNotificationPermission();

  timerInterval = setInterval(() => {
    state.remaining--;
    updateTimerDisplay();
    updateGrowingPlant();

    if (state.remaining <= 0) {
      clearInterval(timerInterval);
      onTimerEnd();
    }
  }, 1000);
}

function pauseTimer() {
  state.running = false;
  state.paused = true;
  clearInterval(timerInterval);
  releaseWakeLock();
  const btn = document.getElementById('btnStart');
  btn.textContent = '继续';
  btn.className = 'btn btn-primary';
  document.getElementById('timerSub').textContent = '已暂停';
  const secondaryBtn = document.getElementById('btnReset');
  secondaryBtn.textContent = state.mode === 'break' ? '结束' : '重置';
}

function endBreakEarly() {
  clearInterval(timerInterval);
  state.running = false;
  state.paused = false;
  releaseWakeLock();

  state.mode = 'focus';
  state.remaining = state.focusMin * 60;
  state.total = state.remaining;

  const btn = document.getElementById('btnStart');
  btn.textContent = '开始专注';
  btn.className = 'btn btn-primary';
  document.getElementById('timerSub').textContent = '休息已结束，点击开始专注';

  document.getElementById('btnReset').style.display = 'none';
  document.getElementById('seedSelector').style.pointerEvents = '';
  document.getElementById('seedSelector').style.opacity = '';

  updateTimerDisplay();
  updateGrowingPlant();
  updateModeUI();
  showToast('休息已结束，进入专注准备状态');
  save();
}

function resetTimer() {
  // Focus mode running -> confirm abandon
  if (state.running && state.mode === 'focus') {
    openAbandonModal();
    return;
  }
  // Break mode -> end break early (running or paused)
  if ((state.running || state.paused) && state.mode === 'break') {
    endBreakEarly();
    return;
  }
  doReset();
}

function doReset() {
  clearInterval(timerInterval);
  state.running = false;
  state.paused = false;
  state.remaining = (state.mode === 'focus' ? state.focusMin : state.breakMin) * 60;
  state.total = state.remaining;

  const btn = document.getElementById('btnStart');
  if (state.mode === 'focus') {
    btn.textContent = '开始专注';
    btn.className = 'btn btn-primary';
  } else {
    btn.textContent = '开始休息';
    btn.className = 'btn btn-break';
  }
  document.getElementById('timerSub').textContent = state.mode === 'focus' ? '点击开始专注' : '休息时间';
  document.getElementById('btnReset').style.display = 'none';
  document.getElementById('seedSelector').style.pointerEvents = '';
  document.getElementById('seedSelector').style.opacity = '';
  updateTimerDisplay();
  updateGrowingPlant();
  updateModeUI();
}

function onTimerEnd() {
  state.running = false;

  // Mobile feedback: vibration
  if (navigator.vibrate) {
    navigator.vibrate([200, 100, 200]);
  }

  // Release wake lock
  releaseWakeLock();

  if (state.mode === 'focus') {
    completeSession(false);
    const def = getEntityDef(state.selectedEntity.category, state.selectedEntity.id);
    const entityName = def ? def.name : '伙伴';
    if (state.selectedEntity.category === 'tree') {
      showToast('专注完成！种下了一棵' + entityName + '，休息一下吧 🌿');
      sendNotification('🌿 专注完成！', '种下了一棵' + entityName + '，休息一下吧');
    } else {
      showToast('专注完成！成功养育了一只' + entityName + '，休息一下吧 🐾');
      sendNotification('🐾 专注完成！', '成功养育了一只' + entityName + '，休息一下吧');
    }
    playSound();
    checkUnlocks(false);

    state.mode = 'break';
    state.remaining = state.breakMin * 60;
    state.total = state.remaining;
    const btn = document.getElementById('btnStart');
    btn.textContent = '开始休息';
    btn.className = 'btn btn-break';
    document.getElementById('timerSub').textContent = '准备休息';
  } else {
    showToast('休息结束，继续加油！🌱');
    playSound();
    sendNotification('🌱 休息结束！', '继续加油，开始新的专注吧');

    state.mode = 'focus';
    state.remaining = state.focusMin * 60;
    state.total = state.remaining;
    const btn = document.getElementById('btnStart');
    btn.textContent = '开始专注';
    btn.className = 'btn btn-primary';
    document.getElementById('timerSub').textContent = '点击开始专注';
  }

  document.getElementById('btnReset').style.display = 'none';
  document.getElementById('seedSelector').style.pointerEvents = '';
  document.getElementById('seedSelector').style.opacity = '';
  updateTimerDisplay();
  updateGrowingPlant();
  updateModeUI();
  updateSessionInfo();
  save();
}

// ============================================================
// COMPLETE SESSION (replaces plantTree)
// ============================================================
function completeSession(failed) {
  const randomPos = genRandomPosition(state.selectedEntity.category);
  const entity = {
    category: state.selectedEntity.category,
    type: state.selectedEntity.id,
    date: today(),
    ts: Date.now(),
    dead: (state.selectedEntity.category === 'tree') ? failed : false,
    failed: (state.selectedEntity.category === 'animal') ? failed : false,
    posX: randomPos.posX,
    posY: randomPos.posY
  };
  state.entities.unshift(entity);

  const d = today();
  if (!state.history[d]) state.history[d] = { trees:0, minutes:0, deadTrees:0, animals:0, escapedAnimals:0 };

  if (state.selectedEntity.category === 'tree') {
    if (failed) {
      state.history[d].deadTrees = (state.history[d].deadTrees || 0) + 1;
    } else {
      state.history[d].trees++;
      state.history[d].minutes += state.focusMin;
      state.totalFocusMinutes += state.focusMin;
    }
  } else {
    if (failed) {
      state.history[d].escapedAnimals = (state.history[d].escapedAnimals || 0) + 1;
    } else {
      state.history[d].animals = (state.history[d].animals || 0) + 1;
      state.history[d].minutes += state.focusMin;
      state.totalFocusMinutes += state.focusMin;
    }
  }
}

// Legacy wrapper
function plantTree(dead) {
  const origEntity = state.selectedEntity;
  state.selectedEntity = { category: 'tree', id: state.selectedEntity.id };
  completeSession(dead);
  state.selectedEntity = origEntity;
}

// ============================================================
// GROWING PLANT ANIMATION
// ============================================================
function updateGrowingPlant() {
  const el = document.getElementById('growingPlant');
  if (!el) return;

  if (state.mode === 'break') {
    el.innerHTML = `<svg viewBox="0 0 60 60"><text x="30" y="38" text-anchor="middle" font-size="28">☕</text></svg>`;
    return;
  }

  const category = state.selectedEntity.category;
  const entityId = state.selectedEntity.id;

  if (!state.running && !state.paused) {
    // Idle - show selected entity preview
    const def = getEntityDef(category, entityId);
    if (def) {
      el.innerHTML = def.svg.replace('viewBox="0 0 40 40"', 'viewBox="0 0 40 40" class="sway"');
    }
    return;
  }

  const progress = state.total > 0 ? 1 - (state.remaining / state.total) : 0;

  if (state.paused) {
    el.style.opacity = '0.6';
  } else {
    el.style.opacity = '1';
  }

  let stageSvg;
  if (category === 'tree') {
    if (progress < 0.1) {
      stageSvg = GROWING_STAGES.seed;
    } else if (progress < 0.3) {
      stageSvg = GROWING_STAGES.sprout;
    } else if (progress < 0.6) {
      stageSvg = GROWING_STAGES.small;
    } else if (progress < 0.9) {
      stageSvg = GROWING_STAGES.medium;
    } else {
      const def = getEntityDef('tree', entityId);
      stageSvg = def ? def.svg : GROWING_STAGES.medium;
    }
  } else {
    // Animal type-specific growth profile (not all start from egg)
    const entityDef = getEntityDef('animal', entityId);
    const growthMode = entityDef && entityDef.growthMode ? entityDef.growthMode : 'default';
    const profile = GROWING_STAGES_ANIMAL[entityId] || GROWING_STAGES_ANIMAL[growthMode] || GROWING_STAGES_ANIMAL.default;
    if (progress < 0.2) {
      stageSvg = profile[0];
    } else if (progress < 0.45) {
      stageSvg = profile[1];
    } else if (progress < 0.75) {
      stageSvg = profile[2];
    } else if (progress < 0.92) {
      stageSvg = profile[3];
    } else {
      const def = getEntityDef('animal', entityId);
      stageSvg = def ? def.svg : profile[3];
    }
  }
  el.innerHTML = stageSvg;
}

// ============================================================
// SOUND
// ============================================================
function playSound() {
  if (!document.getElementById('soundToggle').checked) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.12, ctx.currentTime + i*0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.15 + 0.3);
      osc.start(ctx.currentTime + i*0.15);
      osc.stop(ctx.currentTime + i*0.15 + 0.3);
    });
  } catch(e) {}
}

// ============================================================
// UI UPDATES
// ============================================================
function updateTimerDisplay() {
  const m = Math.floor(state.remaining / 60);
  const s = state.remaining % 60;
  document.getElementById('timerTime').textContent =
    `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

  // Progress ring
  const pct = state.total > 0 ? state.remaining / state.total : 0;
  const circumference = 2 * Math.PI * 100; // ~628.32
  const offset = circumference * (1 - pct);
  const ring = document.getElementById('progressRing');
  ring.style.strokeDashoffset = offset;

  // Leaf position at progress end
  const leaf = document.getElementById('progressLeaf');
  if (state.running || state.paused) {
    leaf.setAttribute('opacity', '1');
    const angle = (1 - pct) * 360;
    leaf.setAttribute('transform', `rotate(${angle - 90} 110 110)`);
  } else {
    leaf.setAttribute('opacity', '0');
  }

  // Title
  const modeStr = state.mode === 'focus' ? '专注' : '休息';
  document.title = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} - ${modeStr} | 专注丛林`;
}

function updateModeUI() {
  const label = document.getElementById('modeLabel');
  const ring = document.getElementById('progressRing');
  const btn = document.getElementById('btnStart');

  if (state.mode === 'focus') {
    label.textContent = '专 注 模 式';
    label.className = 'mode-label focus';
    ring.className = 'ring-progress focus';
  } else {
    label.textContent = '休 息 时 间';
    label.className = 'mode-label break';
    ring.className = 'ring-progress break';
  }
  if (!state.running && !state.paused) {
    document.title = '专注丛林 - Focus Jungle';
  }
}

function updateSessionInfo() {
  const d = today();
  const h = state.history[d] || { trees:0, minutes:0, animals:0 };
  const totalSessions = (h.trees || 0) + (h.animals || 0);
  document.getElementById('sessionInfo').textContent = `今日已专注 ${totalSessions} 次 · ${h.minutes || 0} 分钟`;
}

function onSettingChange() {
  const f = parseInt(document.getElementById('focusMin').value) || 25;
  const b = parseInt(document.getElementById('breakMin').value) || 5;
  state.focusMin = Math.max(1, Math.min(120, f));

  if (!state.running && !state.paused) {
    state.remaining = (state.mode === 'focus' ? state.focusMin : state.breakMin) * 60;
    state.total = state.remaining;
    updateTimerDisplay();

}

  const labelEl = document.querySelector('.unlock-label');

    labelEl.textContent = category === 'animal' ? '新 动 物 解 锁' : '新 树 种 解 锁';
  }

    .replace('viewBox="0 0 40 40"', 'viewBox="0 0 40 40" width="72" height="72"');
  document.getElementById('unlockTreeName').textContent = entityDef.name;
  document.getElementById('unlockTreeDesc').textContent = entityDef.desc;

  // Create particles
  const particles = document.getElementById('unlockParticles');
  const colors = ['#a1d494','#f5c842','#ff9fb5','#d4a5e8','#4ab85f'];
  let html = '';
  for (let i = 0; i < 20; i++) {
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const tx = (Math.random() - 0.5) * 120;
    const ty = (Math.random() - 0.5) * 120;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const delay = Math.random() * 1;
    const size = 4 + Math.random() * 6;
    html += `<div class="particle" style="left:${x}%;top:${y}%;width:${size}px;height:${size}px;background:${color};--tx:${tx}px;--ty:${ty}px;animation-delay:${delay}s"></div>`;
  }
  particles.innerHTML = html;

  document.getElementById('unlockModal').classList.add('show');
}
function closeUnlockModal() {

}

// LAND PAGE
// ============================================================
function switchLandView(view, el) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('landDay').style.display = view === 'day' ? 'block' : 'none';
  document.getElementById('landMonth').style.display = view === 'month' ? 'block' : 'none';
  document.getElementById('landYear').style.display = view === 'year' ? 'block' : 'none';

  if (view !== 'day') stopAnimalRoaming();
  if (view === 'day') renderDayView();
  if (view === 'month') renderMonthView();
  if (view === 'year') renderYearView();
}

function stopAnimalRoaming() {
  if (animalRoamTimer) {
    clearTimeout(animalRoamTimer);
    animalRoamTimer = null;
  }
}

function startAnimalRoaming() {
  stopAnimalRoaming();
  const dayView = document.getElementById('landDay');
  if (!dayView || dayView.style.display === 'none') return;

  const step = () => {
    const roamingEls = Array.from(document.querySelectorAll('.land-cell.is-roaming[data-failed="0"]'));
    if (roamingEls.length === 0) return;

    let moved = false;
    roamingEls.forEach(el => {
      if (Math.random() < 0.35) return;
      const curX = parseFloat(el.style.left || '50');
      const curY = parseFloat(el.style.top || '50');
      const dx = (Math.random() - 0.5) * 4.5;
      const dy = (Math.random() - 0.5) * 3.8;
      const nextX = Math.max(10, Math.min(90, curX + dx));
      const nextY = Math.max(12, Math.min(88, curY + dy));
      el.style.left = `${nextX.toFixed(2)}%`;
      el.style.top = `${nextY.toFixed(2)}%`;

      const ts = Number(el.dataset.entityTs || 0);
      const idx = state.entities.findIndex(item => item.ts === ts);
      if (idx >= 0) {
        state.entities[idx].posX = nextX;
        state.entities[idx].posY = nextY;
        moved = true;
      }
    });

    if (moved) save();
    animalRoamTimer = setTimeout(step, 2000 + Math.random() * 2000);
  };

  animalRoamTimer = setTimeout(step, 1800 + Math.random() * 1200);
}

// --- Day View (Flat Grassland) ---
function renderDayView() {
  const d = today();
  const todayEntities = state.entities
    .filter(t => t.date === d)
    .map(e => ensureEntityPosition(e));

  // Keep positions for legacy records
  let updated = false;
  state.entities = state.entities.map(e => {
    if (e.date !== d) return e;
    const next = ensureEntityPosition(e);
    if (next.posX !== e.posX || next.posY !== e.posY) updated = true;
    return next;
  });
  if (updated) save();

  // Date label
  const dateObj = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  document.getElementById('dayDate').textContent = `${d.replace(/-/g,'.')}  星期${weekdays[dateObj.getDay()]}`;

  // Flat grass random placement
  const grid = document.getElementById('landGrid');
  let html = '';
  todayEntities.forEach((entity, i) => {
    const isFailed = entity.dead || entity.failed;
    const category = entity.category || 'tree';
    const def = getEntityDef(category, entity.type);
    const entityName = isFailed
      ? (category === 'animal' ? '逃跑' : '枯萎')
      : (def ? def.name : (category === 'animal' ? '动物' : '树'));
    const svgHtml = getEntitySvg(category, entity.type, isFailed);
    const swayClass = isFailed ? '' : (i === 0 ? 'tree-pop' : 'tree-sway');
    const roamingClass = (!isFailed && category === 'animal') ? 'is-roaming' : '';
    const posX = entity.posX.toFixed(2);
    const posY = entity.posY.toFixed(2);
    html += `<div class="land-cell ${category === 'animal' ? 'has-animal' : 'has-tree'} ${isFailed ? 'dead' : ''} ${roamingClass}"
      data-entity-ts="${entity.ts}" data-category="${category}" data-failed="${isFailed ? '1' : '0'}"
      style="left:${posX}%;top:${posY}%" title="${entityName}">
      <div class="tree-ground-shadow"></div>
      <div class="tree-on-cell"><div class="${swayClass}">${svgHtml}</div></div>
    </div>`;
  });
  grid.innerHTML = '<div class="land-grid-soil-left"></div>' + html;

  // Summary
  const hist = state.history[d] || {};
  const aliveT = hist.trees || 0;
  const deadT = hist.deadTrees || 0;
  const aliveA = hist.animals || 0;
  const escapedA = hist.escapedAnimals || 0;
  const minutes = hist.minutes || 0;
  let summaryParts = [];
  if (aliveT > 0 || deadT > 0) summaryParts.push(`<strong>${aliveT}</strong> 棵树${deadT > 0 ? `（${deadT} 枯萎）` : ''}`);
  if (aliveA > 0 || escapedA > 0) summaryParts.push(`<strong>${aliveA}</strong> 只动物${escapedA > 0 ? `（${escapedA} 逃跑）` : ''}`);
  document.getElementById('daySummary').innerHTML = `今日丛林：${summaryParts.length > 0 ? summaryParts.join('，') : '等待你的专注'} · 专注 <strong>${minutes}</strong> 分钟`;

  // Ambient particles
  const totalAlive = aliveT + aliveA;
  const particles = document.getElementById('landParticles');
  if (particles && totalAlive > 0) {
    const colors = ['#a1d494','#8cb870','#f5e6b8','#c8e6c0'];
    let phtml = '';
    const count = Math.min(totalAlive * 2, 12);
    for (let p = 0; p < count; p++) {
      const x = 5 + Math.random() * 90;
      const y = 5 + Math.random() * 90;
      const dx = (Math.random() - 0.5) * 40;
      const dy = -20 - Math.random() * 30;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const delay = Math.random() * 6;
      const dur = 4 + Math.random() * 4;
      const isLeaf = Math.random() > 0.5;
      phtml += `<div class="land-particle ${isLeaf ? 'leaf-particle' : 'sparkle-particle'}"
        style="left:${x}%;top:${y}%;--dx:${dx}px;--dy:${dy}px;
        animation-delay:${delay}s;animation-duration:${dur}s;
        ${isLeaf ? `background:${color}` : ''}"></div>`;
    }
    particles.innerHTML = phtml;
  } else if (particles) {
    particles.innerHTML = '';
  }

  startAnimalRoaming();
}

// --- Month View (Isometric Land) ---
function renderMonthView() {
  const year = viewYear;
  const month = viewMonth;

  document.getElementById('monthLabel').textContent = `${year}年${month+1}月`;

  // Gather all entities for this month
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthEntities = [];
  let monthTrees = 0, monthAnimals = 0, monthMin = 0, monthDays = 0;
  let monthDead = 0, monthEscaped = 0;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hist = state.history[dateStr];
    if (hist) {
      monthTrees += hist.trees || 0;
      monthAnimals += hist.animals || 0;
      monthMin += hist.minutes || 0;
      monthDead += hist.deadTrees || 0;
      monthEscaped += hist.escapedAnimals || 0;
      if ((hist.trees || 0) + (hist.animals || 0) > 0) monthDays++;
    }
    const dayEnts = state.entities.filter(t => t.date === dateStr);
    dayEnts.forEach(e => monthEntities.push(e));
  }

  // Compute entity size based on count
  const totalCount = monthEntities.length;
  let entitySize;
  if (totalCount <= 8) entitySize = 36;
  else if (totalCount <= 15) entitySize = 28;
  else if (totalCount <= 30) entitySize = 22;
  else if (totalCount <= 50) entitySize = 16;
  else entitySize = 12;

  // Generate positions for entities inside the diamond
  const grid = document.getElementById('monthGrid');
  let html = '<div class="month-land-soil-left"></div>';

  // Use seeded positions based on entity timestamp for consistency
  monthEntities.forEach((entity, i) => {
    const isFailed = entity.dead || entity.failed;
    const category = entity.category || 'tree';
    const svgHtml = getEntitySvg(category, entity.type, isFailed);
    const failedClass = isFailed ? 'dead-entity' : '';

    // Generate position inside diamond using entity's timestamp as seed
    const seed = (entity.ts || i * 137) % 10000;
    const pos = getSeededDiamondPosition(seed, i, totalCount);

    html += `<div class="month-entity ${failedClass}" style="left:${pos.x}%;top:${pos.y}%;width:${entitySize}px;height:${entitySize}px;z-index:${Math.round(pos.y)}">${svgHtml}</div>`;
  });

  grid.innerHTML = html;

  // Month stats
  document.getElementById('monthStats').innerHTML = `
    <div class="month-stat"><div class="month-stat-val">${monthTrees}</div><div class="month-stat-label">棵树</div></div>
    <div class="month-stat"><div class="month-stat-val">${monthAnimals}</div><div class="month-stat-label">只动物</div></div>
    <div class="month-stat"><div class="month-stat-val">${monthMin}</div><div class="month-stat-label">分钟</div></div>
    <div class="month-stat"><div class="month-stat-val">${monthDays}</div><div class="month-stat-label">天</div></div>
  `;
}

// Generate a position inside a diamond using a seed for consistency
function getSeededDiamondPosition(seed, index, total) {
  // Use golden ratio distribution for even spacing
  const golden = 0.618033988749895;
  const angle = ((index * golden) % 1) * Math.PI * 2;
  const r = 0.3 + ((seed % 100) / 100) * 0.35; // radius 0.3-0.65

  let x = 50 + Math.cos(angle) * r * 40;
  let y = 50 + Math.sin(angle) * r * 40;

  // Ensure inside diamond: |x-50|/45 + |y-50|/45 <= 1
  const dx = Math.abs(x - 50) / 42;
  const dy = Math.abs(y - 50) / 42;
  if (dx + dy > 1) {
    const scale = 0.9 / (dx + dy);
    x = 50 + (x - 50) * scale;
    y = 50 + (y - 50) * scale;
  }

  return { x: x.toFixed(1), y: y.toFixed(1) };
}

function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  renderMonthView();
}

// --- Year View (Isometric Land) ---
function renderYearView() {
  const year = new Date().getFullYear();
  document.getElementById('yearLabel').textContent = `${year} 年度丛林`;

  // Gather all entities for this year
  const yearEntities = [];
  let yearTrees = 0, yearAnimals = 0, yearMin = 0, yearDays = 0;

  for (const k in state.history) {
    if (k.startsWith(year.toString())) {
      yearTrees += state.history[k].trees || 0;
      yearAnimals += state.history[k].animals || 0;
      yearMin += state.history[k].minutes || 0;
      if ((state.history[k].trees || 0) + (state.history[k].animals || 0) > 0) yearDays++;
    }
  }

  // Get all entities for this year
  const yearPrefix = year.toString();
  state.entities.forEach(e => {
    if (e.date && e.date.startsWith(yearPrefix)) {
      yearEntities.push(e);
    }
  });

  // Compute entity size based on count (year has more entities, so smaller)
  const totalCount = yearEntities.length;
  let entitySize;
  if (totalCount <= 12) entitySize = 30;
  else if (totalCount <= 30) entitySize = 22;
  else if (totalCount <= 60) entitySize = 16;
  else if (totalCount <= 120) entitySize = 12;
  else if (totalCount <= 200) entitySize = 9;
  else entitySize = 7;

  // Render entities on isometric land
  const grid = document.getElementById('yearGrid');
  let html = '<div class="year-land-soil-left"></div>';

  yearEntities.forEach((entity, i) => {
    const isFailed = entity.dead || entity.failed;
    const category = entity.category || 'tree';
    const svgHtml = getEntitySvg(category, entity.type, isFailed);
    const failedClass = isFailed ? 'dead-entity' : '';

    const seed = (entity.ts || i * 97) % 10000;
    const pos = getSeededDiamondPosition(seed, i, totalCount);

    html += `<div class="year-entity ${failedClass}" style="left:${pos.x}%;top:${pos.y}%;width:${entitySize}px;height:${entitySize}px;z-index:${Math.round(parseFloat(pos.y))}">${svgHtml}</div>`;
  });

  grid.innerHTML = html;

  // Year stats
  document.getElementById('yearStats').innerHTML = `
    <div class="year-stat"><div class="year-stat-val">${yearTrees}</div><div class="year-stat-label">棵树</div></div>
    <div class="year-stat"><div class="year-stat-val">${yearAnimals}</div><div class="year-stat-label">只动物</div></div>
    <div class="year-stat"><div class="year-stat-val">${yearMin}</div><div class="year-stat-label">分钟</div></div>
    <div class="year-stat"><div class="year-stat-val">${yearDays}</div><div class="year-stat-label">天</div></div>
  `;
}

function renderLand() {
  renderDayView();
  renderMonthView();
  renderYearView();
}

// ============================================================
// STATS PAGE
// ============================================================
function renderStats() {
  const d = today();
  const h = state.history[d] || { trees:0, minutes:0, deadTrees:0, animals:0, escapedAnimals:0 };

  // Streak - counts days with any successful session
  let streak = 0;
  let check = new Date();
  while (true) {
    const key = check.toISOString().slice(0,10);
    const dayHist = state.history[key];
    if (dayHist && ((dayHist.trees || 0) + (dayHist.animals || 0)) > 0) {
      streak++;
      check.setDate(check.getDate() - 1);
    } else break;
  }

  // Totals
  let totalTrees = 0, totalAnimals = 0, totalMin = 0, totalDead = 0, totalEscaped = 0;
  for (const k in state.history) {
    totalTrees += state.history[k].trees || 0;
    totalAnimals += state.history[k].animals || 0;
    totalMin += state.history[k].minutes || 0;
    totalDead += state.history[k].deadTrees || 0;
    totalEscaped += state.history[k].escapedAnimals || 0;
  }

  document.getElementById('statsTodayLabel').textContent = `今天 · ${d.slice(5).replace('-','/')}`;
  document.getElementById('statTodayTrees').textContent = (h.trees || 0) + (h.animals || 0);
  document.getElementById('statTodayMin').textContent = h.minutes || 0;
  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statTotalTrees').textContent = totalTrees;
  document.getElementById('statTotalMin').textContent = totalMin;
  document.getElementById('statDeadTrees').textContent = totalDead + totalEscaped;
  document.getElementById('statUnlocked').textContent =
    (state.unlockedTrees.length + state.unlockedAnimals.length) + '/' + (TREE_TYPES.length + ANIMAL_TYPES.length);

  // Update stat labels to reflect animals
  const totalAnimalsEl = document.getElementById('statTotalAnimals');
  if (totalAnimalsEl) totalAnimalsEl.textContent = totalAnimals;

  // Achievements grid - trees + animals
  const grid = document.getElementById('achievementsGrid');
  const treeCards = TREE_TYPES.map(t => {
    const unlocked = isEntityUnlocked('tree', t.id);
    return `<div class="achievement-card ${unlocked?'unlocked':'locked'}">
      <div class="achievement-icon">${t.svg.replace('viewBox="0 0 40 40"','viewBox="0 0 40 40" width="32" height="32"')}</div>
      <div class="achievement-info">
        <div class="achievement-name">${t.name}</div>
        <div class="achievement-desc">${unlocked ? t.desc : `累计专注 ${t.unlockMinutes} 分钟解锁`}</div>
      </div>
      <div>${unlocked
        ? '<span class="achievement-check">✓</span>'
        : '<span class="achievement-lock">🔒</span>'
      }</div>
    </div>`;
  }).join('');

  const animalCards = ANIMAL_TYPES.map(a => {
    const unlocked = isEntityUnlocked('animal', a.id);
    return `<div class="achievement-card ${unlocked?'unlocked':'locked'}">
      <div class="achievement-icon">${a.svg.replace('viewBox="0 0 40 40"','viewBox="0 0 40 40" width="32" height="32"')}</div>
      <div class="achievement-info">
        <div class="achievement-name">${a.name}</div>
        <div class="achievement-desc">${unlocked ? a.desc : `累计专注 ${a.unlockMinutes} 分钟解锁`}</div>
      </div>
      <div>${unlocked
        ? '<span class="achievement-check">✓</span>'
        : '<span class="achievement-lock">🔒</span>'
      }</div>
    </div>`;
  }).join('');

  grid.innerHTML = `
    <div style="grid-column:1/-1;font-size:13px;font-weight:600;color:var(--on-surface);margin:8px 0 4px">🌿 树种图鉴</div>
    ${treeCards}
    <div style="grid-column:1/-1;font-size:13px;font-weight:600;color:var(--on-surface);margin:12px 0 4px">🐾 动物图鉴</div>
    ${animalCards}
  `;
}

// ============================================================
// MOBILE APIs: Wake Lock, Notification, Vibration
// ============================================================
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch (e) { /* wake lock not available */ }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release();
    wakeLock = null;
  }
}

// Re-acquire wake lock when page becomes visible again
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.running) {
    requestWakeLock();
  }
});

let notifPermissionAsked = false;
function requestNotificationPermission() {
  if (notifPermissionAsked) return;
  if ('Notification' in window && Notification.permission === 'default') {
    notifPermissionAsked = true;
    Notification.requestPermission();
  }
}

function sendNotification(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification(title, {
        body: body,
        icon: '/icon-192.png',
        badge: '/icon-192.png',
        tag: 'focus-jungle-timer'
      });
    } catch (e) { /* notification failed silently */ }
  }
}

// ============================================================
// PWA INSTALL PROMPT
// ============================================================
let deferredPrompt = null;
let installBannerShown = false;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  
  if (!localStorage.getItem('pwaInstallDismissed') && !installBannerShown) {
    setTimeout(() => {
      showInstallBanner();
    }, 2000);
  }
});

function showInstallBanner() {
  const banner = document.getElementById('installBanner');
  if (banner) {
    banner.classList.add('show');
    installBannerShown = true;
  }
}

function hideInstallBanner() {
  const banner = document.getElementById('installBanner');
  if (banner) {
    banner.classList.remove('show');
    installBannerShown = false;
  }
}

document.getElementById('installBtn')?.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    
    if (outcome === 'accepted') {
      console.log('PWA installed');
      showToast('🎉 安装成功！专注丛林已添加到主屏幕');
    } else {
      console.log('PWA install dismissed');
    }
    
    deferredPrompt = null;
    hideInstallBanner();
  }
});

document.getElementById('dismissInstallBtn')?.addEventListener('click', () => {
  localStorage.setItem('pwaInstallDismissed', 'true');
  hideInstallBanner();
});

window.addEventListener('appinstalled', () => {
  console.log('App was installed');
  hideInstallBanner();
  deferredPrompt = null;
});

// PWA Service Worker registration
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => {
        console.log('SW registered:', reg.scope);
        
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              showToast('🔄 发现新版本，刷新页面更新');
            }
          });
        });
      })
      .catch(err => {
        console.error('SW registration failed:', err);
      });
  });
}
